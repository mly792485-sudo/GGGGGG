name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Install Capacitor packages
        run: npm install @capacitor/ios @capacitor/core @capacitor/cli

      - name: Add Capacitor iOS Platform
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            npx cap sync ios
          fi

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install

      - name: Build Xcode Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath App.xcarchive archive -allowProvisioningUpdates
