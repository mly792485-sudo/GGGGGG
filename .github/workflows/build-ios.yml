name: Build iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Install Capacitor packages
        run: npm install @capacitor/ios @capacitor/core @capacitor/cli

      - name: Add or Sync Capacitor iOS
        run: |
          npx cap add ios || true
          npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          if [ -d "ios/App" ]; then
            cd ios/App
            pod install
          elif [ -d "ios" ]; then
            cd ios
            pod install
          fi

      - name: Build Xcode Archive
        run: |
          if [ -d "ios/App" ]; then
            cd ios/App
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath App.xcarchive archive -allowProvisioningUpdates
          elif [ -d "ios" ]; then
            cd ios
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath App.xcarchive archive -allowProvisioningUpdates
          fi
